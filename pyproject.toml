[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "po-preflight"
version = "0.1.0"
description = "Agentic purchase-order intake, validation, and multi-channel approval system"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.0.0",
    "python-multipart>=0.0.9",
    "rapidfuzz>=3.9.0",
    "langgraph>=0.2.0",
    "langgraph-checkpoint-sqlite>=2.0.0",
    "langchain-core>=0.3.0",
    "openpyxl>=3.1.0",
    "psycopg[binary,pool]>=3.1",
    "pyjwt>=2.8.0",
]

[project.optional-dependencies]
pdf = ["pypdf>=5.0"]
excel = ["openpyxl>=3.1.0"]
test = ["httpx>=0.27.0", "openpyxl>=3.1.0", "pypdf>=5.0"]
dev = [
    "ruff>=0.5.0",
    "mypy>=1.10.0",
    "httpx>=0.27.0",
    "openpyxl>=3.1.0",
    "pypdf>=5.0",
]

[project.scripts]
preflight = "preflight.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
