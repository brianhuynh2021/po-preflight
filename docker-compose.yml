version: "3.8"

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: po-preflight-backend
    restart: unless-stopped
    ports:
      - "8001:8001"
    environment:
      - PORT=8001
      - PREFLIGHT_ENV=development
      - PREFLIGHT_AUTH_REQUIRED=true
      - PREFLIGHT_ADMIN_KEY=pf_dev_adm_9901
      - PREFLIGHT_MANAGER_KEY=pf_dev_mgr_8802
      - PREFLIGHT_AUDITOR_KEY=pf_dev_aud_7703
      - PREFLIGHT_VIEWER_KEY=pf_dev_view_6604
      - PREFLIGHT_DB_PATH=/app/runtime/data/preflight.db
      - TELEGRAM_DRY_RUN=true
      - ZALO_DRY_RUN=true

    volumes:
      - ./runtime/data:/app/runtime/data
      - ./runtime/uploads:/app/runtime/uploads
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health/live', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    container_name: po-preflight-web
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8001
    depends_on:
      - backend

