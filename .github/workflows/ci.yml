name: CI

on:
  pull_request:
  push:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    name: Backend Unit Tests & Linters (Python 3.12)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,pdf,excel]"
      - name: Smoke import check
        run: |
          python -c "import preflight.api.app; import preflight.agent.graph; import preflight.rag.matcher; import preflight.config"
      - name: Verify .env.example matches Settings
        run: |
          python scripts/gen_env_example.py --check
      - name: Run Backend Unittests
        run: |
          PYTHONPATH=src python -m unittest discover -s tests -v
      - name: Run Ruff Lint Check
        run: |
          ruff check src/ tests/
        continue-on-error: true

  frontend:
    name: Frontend Typecheck, Lint & Rendered HTML Tests (Node 22)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: apps/web/package-lock.json
      - name: Install Frontend dependencies
        run: |
          cd apps/web && npm ci
      - name: Frontend TypeScript Check
        run: |
          cd apps/web && npx tsc --noEmit
      - name: Frontend ESLint
        run: |
          cd apps/web && npm run lint
      - name: Frontend Rendered HTML Tests
        run: |
          cd apps/web && npm run test

  docker:
    name: Docker Container Build Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build Docker Image
        run: |
          docker build -t po-preflight:test .

  terraform:
    name: Terraform Infrastructure Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8
      - name: Check formatting
        run: terraform fmt -check -recursive infra/terraform
      - name: Initialize without a backend
        run: terraform -chdir=infra/terraform init -backend=false
      - name: Validate configuration
        run: terraform -chdir=infra/terraform validate
