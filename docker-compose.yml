version: "3.8"

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: po-preflight-backend
    restart: unless-stopped
    ports:
      - "8001:8001"
    environment:
      - PORT=8001
      - PREFLIGHT_AUTH_REQUIRED=false
      - PREFLIGHT_DB_PATH=/app/runtime/data/preflight.db
      - TELEGRAM_DRY_RUN=true
      - ZALO_DRY_RUN=true
    volumes:
      - ./runtime/data:/app/runtime/data
      - ./runtime/uploads:/app/runtime/uploads
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health/live', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
