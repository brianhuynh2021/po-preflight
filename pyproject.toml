[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "po-preflight"
version = "0.1.0"
description = "Agentic purchase-order intake, validation, and multi-channel approval system"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
pdf = ["pypdf>=5.0"]

[project.scripts]
preflight = "preflight.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
